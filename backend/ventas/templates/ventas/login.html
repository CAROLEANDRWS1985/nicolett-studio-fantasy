{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Administrativo</title>
    <style>
        body {
            background-color: #2d2d2d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .login-box {
            background: #3a3a3a;
            border: 1px solid #D4AF37;
            border-radius: 10px;
            padding: 40px;
            width: 350px;
        }
        h2 { color: #D4AF37; text-align: center; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #D4AF37;
            background: #2d2d2d;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #D4AF37;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #c9a84c; }
        .error { color: #ff6b6b; text-align: center; margin-top: 10px; }
        .enlaces { color: white; text-align: center; font-size: 14px; margin-top: 15px; }
        .enlaces a { color: #D4AF37; text-decoration: none; }
        .enlaces a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Acceso Privado</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <p class="enlaces">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
        <p class="enlaces">¿Olvidaste tu clave? <a href="{% url 'password_reset' %}">Ingresa aquí</a></p>
    </div>
<!-- OJITO-CLAVE -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var ojo = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var tapado = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.6 9.6 0 0 1 12 4c7 0 11 7 11 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/></svg>';
  document.querySelectorAll('input[type="password"]').forEach(function (inp) {
    if (inp.dataset.ojito) return; inp.dataset.ojito = "1";
    var cs = getComputedStyle(inp);
    var caja = document.createElement("span");
    caja.style.cssText = "position:relative;display:block;width:100%";
    caja.style.margin = cs.margin;
    inp.parentNode.insertBefore(caja, inp);
    caja.appendChild(inp);
    inp.style.margin = "0";
    inp.style.paddingRight = "44px";
    inp.style.width = "100%";
    inp.style.boxSizing = "border-box";
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Mostrar clave");
    b.innerHTML = ojo;
    b.style.cssText = "position:absolute;right:12px;top:0;bottom:0;margin:auto 0;height:28px;width:28px;background:none;border:0;padding:0;cursor:pointer;color:#000;display:flex;align-items:center;justify-content:center";
    b.onclick = function () {
      var ver = inp.type === "password";
      inp.type = ver ? "text" : "password";
      b.innerHTML = ver ? tapado : ojo;
      b.setAttribute("aria-label", ver ? "Ocultar clave" : "Mostrar clave");
      inp.focus();
    };
    caja.appendChild(b);
  });
});
</script>
</body>
</html>

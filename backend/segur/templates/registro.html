<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta — Nicolett Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f2ece3;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .register-container {
            background-color: #fdfbf8;
            width: 100%;
            max-width: 420px;
            padding: 45px 40px;
            border-radius: 4px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            border: 1px solid #e6dcc9;
        }
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            letter-spacing: 3px;
            margin: 0;
            color: #1a1a1a;
        }
        .brand span {
            display: block;
            font-size: 11px;
            letter-spacing: 3px;
            color: #b08d57;
            margin-top: 4px;
        }
        .brand hr {
            width: 60px;
            border: none;
            border-top: 1px solid #b08d57;
            margin: 14px auto 0;
        }
        h2.title {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-weight: 500;
            font-size: 20px;
            color: #333;
            margin-bottom: 25px;
        }
        #register-form label {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #555;
            display: block;
        }
        #register-form input[type="text"],
        #register-form input[type="email"],
        #register-form input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ddd0ba;
            border-radius: 3px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            background-color: #fff;
        }
        #register-form input:focus {
            outline: none;
            border-color: #b08d57;
        }
        #register-form button[type="submit"] {
            width: 100%;
            background-color: #1a1a1a;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 3px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 6px;
        }
        #register-form button[type="submit"]:hover {
            background-color: #b08d57;
        }
        #register-messages {
            margin-top: 16px;
            padding: 10px;
            background-color: #f6f1e8;
            border-radius: 3px;
            color: #6b5b3d;
            text-align: center;
            font-size: 14px;
        }
        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 13px;
        }
        .login-link a {
            color: #b08d57;
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="brand">
            <h1>NICOLETT</h1>
            <span>STUDIO FANTASY</span>
            <hr>
        </div>

        <h2 class="title">Crear cuenta</h2>

        {% if messages %}
            <div id="register-messages">
                {% for message in messages %}
                    <p style="margin:0;">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form id="register-form" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Registrarme</button>
        </form>

        <p class="login-link">
            ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
        </p>
    </div>
<!-- OJITO-CLAVE -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var ojo = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var tapado = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.6 9.6 0 0 1 12 4c7 0 11 7 11 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/></svg>';
  document.querySelectorAll('input[type="password"]').forEach(function (inp) {
    if (inp.dataset.ojito) return; inp.dataset.ojito = "1";
    var cs = getComputedStyle(inp);
    var caja = document.createElement("span");
    caja.style.cssText = "position:relative;display:block;width:100%";
    caja.style.margin = cs.margin;
    inp.parentNode.insertBefore(caja, inp);
    caja.appendChild(inp);
    inp.style.margin = "0";
    inp.style.paddingRight = "44px";
    inp.style.width = "100%";
    inp.style.boxSizing = "border-box";
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Mostrar clave");
    b.innerHTML = ojo;
    b.style.cssText = "position:absolute;right:12px;top:0;bottom:0;margin:auto 0;height:28px;width:28px;background:none;border:0;padding:0;cursor:pointer;color:#000;display:flex;align-items:center;justify-content:center";
    b.onclick = function () {
      var ver = inp.type === "password";
      inp.type = ver ? "text" : "password";
      b.innerHTML = ver ? tapado : ojo;
      b.setAttribute("aria-label", ver ? "Ocultar clave" : "Mostrar clave");
      inp.focus();
    };
    caja.appendChild(b);
  });
});
</script>
</body>
</html>

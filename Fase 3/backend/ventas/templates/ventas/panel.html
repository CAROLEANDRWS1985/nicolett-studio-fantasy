{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #2d2d2d; color: white; }
        .navbar { background-color: #1a1a1a; border-bottom: 2px solid #D4AF37; }
        .navbar-brand { color: #D4AF37 !important; font-weight: bold; }
        .btn-gold { background-color: #D4AF37; color: black; font-weight: bold; }
        .card { background-color: #3a3a3a; border: 1px solid #D4AF37; }
        .card-title { color: #D4AF37; }
    </style>
</head>
<body>
    <nav class="navbar px-4">
        <span class="navbar-brand">⚖️ Panel Administrativo</span>
        <div>
            <span class="text-light me-3">Bienvenida, {{ user.username }}</span>
            <a href="/admin-logout/" class="btn btn-sm btn-outline-warning">Cerrar sesión</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h5 class="card-title">👥 Clientes</h5>
                    <p class="text-light">Ver y gestionar clientes registrados</p>
                    <a href="/gestion-secreta/ventas/persona/" class="btn btn-gold">Ver Clientes</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h5 class="card-title">📅 Citas</h5>
                    <p class="text-light">Ver y gestionar citas legales</p>
                    <a href="/gestion-secreta/ventas/citalegal/" class="btn btn-gold">Ver Citas</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h5 class="card-title">⚙️ Administración</h5>
                    <p class="text-light">Panel completo de administración</p>
                    <a href="/gestion-secreta/" class="btn btn-gold">Ir al Admin</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

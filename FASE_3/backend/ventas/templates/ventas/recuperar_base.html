<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar clave</title>
    <style>
        body {
            background-color: #f3eae0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .login-box {
            background: #fbf9f5;
            border: 1px solid #D4AF37;
            border-radius: 10px;
            padding: 40px;
            width: 350px;
            color: #333;
        }
        h2 { color: #1a1a1a; text-align: center; margin-bottom: 20px; }
        p { font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #D4AF37;
            background: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #333; }
        .errorlist { color: #c0392b; list-style: none; padding: 0; font-size: 13px; }
        ul { font-size: 12px; color: #777; }
        .enlaces { text-align: center; margin-top: 15px; }
        .enlaces a { color: #b8934a; text-decoration: none; font-weight: bold; }
        .enlaces a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        {% block contenido %}{% endblock %}
    </div>
</body>
</html>

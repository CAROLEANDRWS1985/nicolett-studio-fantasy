{% extends 'index.html' %}
{% block margarita %}

<h1 class="title">Uñas</h1>


<div id="unas-messages"></div>
<form >
   <div class="form-row">
    <div class="form-group">
      <label for="id">Id Uñas</label>
      <input type="text" id="id" name="id" required>
    </div>
    <div class="form-group">
      <label for="username">Tipos de uñas</label>
      <input type="text" id="tipo" name="tipo" required>
    </div>
  <div class="form-group">
      <label for="precio">Valor de las uñas</label>
      <input type="text" id="precio" name="precio" required>
    </div>
    
    
    <button type="button" onclick="fnAgregarUnas()">Agregar</button>
    <button type="button" onclick="fnEliminarUnas()">Eliminar</button>
    <button type="button" onclick="fnActualizarUnas()">Actualizar</button>
</form>

   <div id="objCata">
    
   </div>
    
 

<script>
  $( document ).ready(function() {
  
  catalogoListarInnerHtml ()
});

function catalogoListarInnerHtml(){
      var pathUrl= "http://localhost:9010/ventas/pelu/unas"
      $.ajax({
          type: "GET",      // GET, PUT, POST, DELETE
          async: false,      // Sincrónico
          url:pathUrl  ,  // Observe que agrego el rut
          cache: false,
          dataType: "json",             // Formato de envio
          beforeSend: function (data){
              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){
                  alert(data.msg)
                  return
              }                
              var stHtml = `
              <table class="table table-hover">
  <thead>
    <tr>
      
      <th scope="col">Id</th>
      <th scope="col">Tipo</th>
      <th scope="col">Precio</th>
    </tr>
  </thead>
  <tbody>`
              for(var x=0;x<data.registro.length;x++){
                  reg = data.registro [x]
                     stHtml += `
                      <tr>
      
      <td>${reg.id}</td>
      <td>${reg.tipo}</td>
      <td>${reg.precio}</td>
      <td><button type="button" onclick='fnEditarUnas(${reg.id})'> editar
        </button></td>
    </tr>
                    
                     `
                    
              }
              stHtml += `
               </tbody>
</table>
              `
              document.getElementById("objCata").innerHTML = stHtml
          }
      });

  }
  function fnEditarUnas(idUnas){
// alert(idProductos)
var pathUrl= "http://localhost:9010/ventas/pelu/unas/" + idUnas

      $.ajax({
          type: "GET",      // GET, PUT, POST, DELETE
          async: false,      // Sincrónico
          url:pathUrl  ,  // Observe que agrego el rut
          cache: false,
          dataType: "json",             // Formato de envio
          beforeSend: function (data){
              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){
                  alert(data.msg)
                  return
              }  
              document.getElementById('id') .value=data.registro.id             
              document.getElementById('precio') .value=data.registro.precio
              document.getElementById('tipo') .value=data.registro.tipo
            
          }
      });
  }
  function fnEliminarUnas(){
// alert(idProductos)
var pathUrl= "http://localhost:9010/ventas/pelu/unas/" + document.getElementById ("id").value

      $.ajax({
          type: "DELETE",      // GET, PUT, POST, DELETE

          beforeSend: function (data){
              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              
              alert ("Eliminado")
              catalogoListarInnerHtml ()
            
          }
      });
  }
  function fnActualizarUnas(){
// alert(idMasajes)
var pathUrl= "http://localhost:9010/ventas/pelu/unas/" + document.getElementById ("id").value
var parametros= `
{

`
//"imagen": "${document.getElementById ("imagen").value}"

      $.ajax({

              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){

  function fnAgregarUnas(){
// alert(idProductos)
var pathUrl= "http://localhost:9010/ventas/pelu/unas/"

{

`

      $.ajax({

              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){

              }  
              alert ("Agregado")

          }
      });
  }
</script>

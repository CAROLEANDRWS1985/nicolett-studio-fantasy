{% extends 'index.html' %}
{% block margarita %}

<h1 class="title">Aplicacion de Color</h1>


<div id="coloracion-messages"></div>
<form >
   <div class="form-row">
    <div class="form-group">
      <label for="id">Id coloracion</label>
      <input type="text" id="id" name="id" required>
    </div>
    <div class="form-group">
      <label for="username">Color</label>
      <input type="text" id="color" name="color" required>
    </div>
  
    
    <button type="button" onclick="fnAgregarColoracion()">Agregar</button>
    <button type="button" onclick="fnEliminarColoracion()">Eliminar</button>
    <button type="button" onclick="fnActualizarColoracion()">Actualizar</button>
</form>

   <div id="objCata">
    
   </div>
    
 

<script>
  $( document ).ready(function() {
  
  catalogoListarInnerHtml ()
});

function catalogoListarInnerHtml(){
      var pathUrl= "http://localhost:9010/ventas/pelu/coloracion"
      $.ajax({
          type: "GET",      // GET, PUT, POST, DELETE
          async: false,      // Sincrónico
          url:pathUrl  ,  // Observe que agrego el rut
          cache: false,
          dataType: "json",             // Formato de envio
          beforeSend: function (data){
              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){
                  alert(data.msg)
                  return
              }                
              var stHtml = `
              <table class="table table-hover">
  <thead>
    <tr>
      <th scope="col">Id</th>
      <th scope="col">Color</th>
      
    </tr>
  </thead>
  <tbody>`
              for(var x=0;x<data.registro.length;x++){
                  reg = data.registro [x]
                     stHtml += `
                      <tr>
      
      <td>${reg.id}</td>
      <td>${reg.color}</td>
      <td><button type="button" onclick='fnEditarColoracion(${reg.id})'> editar
        </button></td>
    </tr>
                    
                     `
                    
              }
              stHtml += `
               </tbody>
</table>
              `
              document.getElementById("objCata").innerHTML = stHtml
          }
      });

  }
  function fnEditarColoracion(idColoracion){
// alert(idColoracion)
var pathUrl= "http://localhost:9010/ventas/pelu/coloracion/" + idColoracion

      $.ajax({
          type: "GET",      // GET, PUT, POST, DELETE
          async: false,      // Sincrónico
          url:pathUrl  ,  // Observe que agrego el rut
          cache: false,
          dataType: "json",             // Formato de envio
          beforeSend: function (data){
              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){
                  alert(data.msg)
                  return
              }  
              document.getElementById('id') .value=data.registro.id             
              document.getElementById('color') .value=data.registro.color
            
          }
      });
  }
  function fnEliminarColoracion(){
// alert(idProductos)
var pathUrl= "http://localhost:9010/ventas/pelu/coloracion/" + document.getElementById ("id").value

      $.ajax({
          type: "DELETE",      // GET, PUT, POST, DELETE
          async: false,      // Sincrónico
          url:pathUrl  ,  // Observe que agrego el rut
          cache: false,
          dataType: "json",             // Formato de envio
          beforeSend: function (data){
              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              
              alert ("Eliminado")
              catalogoListarInnerHtml ()
            
          }
      });
  }
  function fnActualizarColoracion(){
// alert(idProductos)
var pathUrl= "http://localhost:9010/ventas/pelu/coloracion/" + document.getElementById ("id").value
var parametros= `
{
        "id":${document.getElementById ("id").value},
        "color": "${document.getElementById ("color").value}"
        
    }
`
//"imagen": "${document.getElementById ("imagen").value}"

      $.ajax({
          type: "PUT",      // GET, PUT, POST, DELETE
          data: parametros, 
          async: false,      // Sincrónico
          url:pathUrl  ,  // Observe que agrego el rut
          cache: false,
          dataType: "json",             // Formato de envio
          beforeSend: function (data){
              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){
                  alert(data.msg)
                  return
              }  
              alert ("Actualizar")
              catalogoListarInnerHtml ()
            
          }
      });
  }
  function fnAgregarColoracion(){
// alert(idProductos)
var pathUrl= "http://localhost:9010/ventas/pelu/coloracion/" 
var parametros= `
{
        "id":${document.getElementById ("id").value},

    }
`

      $.ajax({
          type: "POST",      // GET, PUT, POST, DELETE
          data: parametros, 
          async: false,      // Sincrónico
          url:pathUrl  ,  // Observe que agrego el rut
          cache: false,
          dataType: "json",             // Formato de envio
          beforeSend: function (data){
              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){
                  alert(data.msg)
                  return
              }  
              alert ("Eliminado")
              catalogoListarInnerHtml ()
            
          }
      });
  }
</script>

{% endblock %}

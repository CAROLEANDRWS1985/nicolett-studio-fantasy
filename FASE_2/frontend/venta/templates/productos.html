{% extends 'index.html' %}
{% block margarita %}

<h1 class="title">Productos</h1>


<div id="productos-messages"></div>
<form >
   <div class="form-row">
    <div class="form-group">
      <label for="id">Id producto</label>
      <input type="text" id="id" name="id" required>
    </div>
    <div class="form-group">
      <label for="username">Nombre de productos</label>
      <input type="text" id="productos" name="productos" required>
    </div>
  <div class="form-group">
      <label for="precio">Valor del producto</label>
      <input type="text" id="precio" name="precio" required>
    </div>
    <div class="form-group">
      <label for="tipo">Nombre del tipo</label>
      <input type="text" id="tipo" name="tipo" required>
    </div>
    
    <button type="button" onclick="fnAgregarProducto()">Agregar</button>
    <button type="button" onclick="fnEliminarProducto()">Eliminar</button>
    <button type="button" onclick="fnActualizarProducto()">Actualizar</button>
</form>

   <div id="objCata">
    
   </div>
    
 

<script>
  $( document ).ready(function() {
  
  catalogoListarInnerHtml ()
});

function catalogoListarInnerHtml(){
      var pathUrl= "http://localhost:9010/ventas/pelu/productos"
      $.ajax({
          type: "GET",      // GET, PUT, POST, DELETE
          async: false,      // Sincrónico
          url:pathUrl  ,  // Observe que agrego el rut
          cache: false,
          dataType: "json",             // Formato de envio
          beforeSend: function (data){
              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){
                  alert(data.msg)
                  return
              }                
              var stHtml = `
              <table class="table table-hover">
  <thead>
    <tr>
      
      <th scope="col">Producto</th>
      <th scope="col">Precio</th>
      <th scope="col">Tipo</th>
    </tr>
  </thead>
  <tbody>`
              for(var x=0;x<data.registro.length;x++){
                  reg = data.registro [x]
                     stHtml += `
                      <tr>
      
      <td>${reg.descripcion}</td>
      <td>${reg.precio}</td>
      <td>${reg.tipo}</td>
      <td><button type="button" onclick='fnEditarProducto(${reg.id})'> editar
        </button></td>
    </tr>
                    
                     `
                    
              }
              stHtml += `
               </tbody>
</table>
              `
              document.getElementById("objCata").innerHTML = stHtml
          }
      });

  }
  function fnEditarProducto(idProductos){
// alert(idProductos)
var pathUrl= "http://localhost:9010/ventas/pelu/productos/" + idProductos

      $.ajax({
          type: "GET",      // GET, PUT, POST, DELETE
          async: false,      // Sincrónico
          url:pathUrl  ,  // Observe que agrego el rut
          cache: false,
          dataType: "json",             // Formato de envio
          beforeSend: function (data){
              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){
                  alert(data.msg)
                  return
              }  
              document.getElementById('id') .value=data.registro.id             
              document.getElementById('productos') .value=data.registro.descripcion
              document.getElementById('precio') .value=data.registro.precio
              document.getElementById('tipo') .value=data.registro.tipo
            
          }
      });
  }
  function fnEliminarProducto(){
// alert(idProductos)
var pathUrl= "http://localhost:9010/ventas/pelu/productos/" + document.getElementById ("id").value

      $.ajax({
          type: "DELETE",      // GET, PUT, POST, DELETE

          beforeSend: function (data){
              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              
              alert ("Eliminado")
              catalogoListarInnerHtml ()
            
          }
      });
  }
  function fnActualizarProducto(){
// alert(idProductos)
var pathUrl= "http://localhost:9010/ventas/pelu/productos/" + document.getElementById ("id").value
var parametros= `
{

`
//"imagen": "${document.getElementById ("imagen").value}"

      $.ajax({

              // Método de ejecuta antes de enviar

              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){

          }

  function fnAgregarProducto(){
// alert(idProductos)
var pathUrl= "http://localhost:9010/ventas/pelu/productos/" 
var parametros= `
{
        "id":${document.getElementById ("id").value},

        "descripcion": "${document.getElementById ("productos").value}"

`

      $.ajax({
          type: "POST",      // GET, PUT, POST, DELETE
          data: parametros,

              // Método de ejecuta antes de enviar
              console.log('... cargando...');
          }
          , error: function (data) {
              //alert("Error " + data)
              //si hay un error mostramos un mensaje
              console.log('Tenemos problemas Houston ' +JSON.stringify(data));
          },
          success: function (data) {
              //alert("Success" + data)
              if (!data.OK){
                  alert(data.msg)
                  return
              }  
              alert ("Agregado")
              catalogoListarInnerHtml ()
            
          }
      });
  }
</script>
